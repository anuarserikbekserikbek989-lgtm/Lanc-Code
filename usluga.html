<!-- Поле имени (теперь открыто для ввода!) -->

    font-size: 36px;
" placeholder="+7 (XXX) XXXX" required id="phone_number"></input>

<!-- Кнопка отправить заказ -->
<button id="sendOrderBtn" style="
    top: 50%;
    left: 55%;
    position: absolute;
    background-color: lawngreen;
    font-size: 36px;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: bold;
    border-radius: 12px;
    border: 2px solid black;
    transition: 0.2s;
    height: 64px;
    width: 9cm;
    cursor: pointer;
">
    Отправить заказ
</button>
<script>
    document.getElementById('sendOrderBtn').addEventListener('click', function() {
        // 1. Собираем текст из полей ввода на лету
        const nameValue = document.getElementById('clientName').value;
        const phoneValue = document.getElementById('phone_number').value;
        const commentValue = document.getElementById('commentsite').value;

        // Проверка на пустые поля
        if (!nameValue.trim() || !phoneValue.trim()) {
            alert("Пожалуйста, заполните ваше имя и номер телефона!");
            return;
        }

        // 2. Твои правильные ключи
        const tgToken = "8993659223:AAGUDfeB7H4IALnElm3fSClmgqHgcMHfH5g";
        const tgChatId = "8772937687";
        
        // Красивое оформление текста
        const tgMessage = `🚀 *Новый заказ в Lanc Studio!*\n\n` +
                          `👤 *Клиент:* ${nameValue}\n` +
                          `📞 *Телефон:* ${phoneValue}\n` +
                          `💬 *Комментарий:* ${commentValue}\n` +
                          `📅 *Дата:* ${new Date().toLocaleDateString()}`;

        // 3. Исправленный fetch: добавили api., /bot и знак $ перед скобками! [index.1.2.16]
        fetch(`https://telegram.org{tgToken}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: tgChatId,
                text: tgMessage,
                parse_mode: 'Markdown'
            })
        })
        .then(response => {
            if (response.ok) {
                alert("Заказ успешно отправлен в Telegram студии Lanc Studio!");
                // Очищаем форму
                document.getElementById('clientName').value = "";
                document.getElementById = "";
                document.getElementById('commentsite').value = "";
            } else {
                alert("Ошибка бота. Убедитесь, что вы нажали СТАРТ в вашем Telegram-боте!");
            }
        })
        .catch(error => {
            alert("Сбой сети: " + error.message);
        });
    });
</script>
