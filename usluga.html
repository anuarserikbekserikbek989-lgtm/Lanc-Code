<!-- ОБНОВЛЁННЫЙ СКРИПТ: БЕЗ ФЕТЧЕЙ И БЕЗ БЛОКИРОВОК CORS -->
<script>
    document.getElementById('sendOrderBtn').addEventListener('click', function() {
        // 1. Собираем текст из полей ввода
        const nameValue = document.getElementById('clientName').value;
        const phoneValue = document.getElementById('phone_number').value;
        const commentValue = document.getElementById('commentsite').value;

        // Проверяем, чтобы поля были заполнены
        if (!nameValue.trim() || !phoneValue.trim()) {
            alert("Пожалуйста, заполните ваше имя и номер телефона!");
            return;
        }

        // 2. Твои ключи
        const tgToken = "8993659223:AAGUDfeB7H4IALnElm3fSClmgqHgcMHfH5g";
        const tgChatId = "8772937687";
        
        // Оформляем красивый текст
        const tgMessage = `🚀 *Новый заказ в Lanc Studio!*\n\n` +
                          `👤 *Клиент:* ${nameValue}\n` +
                          `📞 *Телефон:* ${phoneValue}\n` +
                          `💬 *Комментарий:* ${commentValue}\n` +
                          `📅 *Дата:* ${new Date().toLocaleDateString()}`;

        alert("Спасибо за заказ! Сейчас откроется окно подтверждения Telegram, нажмите 'Открыть ссылку' чтобы доставить ТГ разработчику.");

        // 3. МАГИЯ: Вместо скрытого fetch мы делаем официальное открытие страницы!
        // Браузер видит это как обычный клик по ссылке и НИКОГДА её не заблокирует!
        const telegramUrl = `https://api.telegram.org/bot${tgToken}/sendMessage?chat_id=${tgChatId}&text=${encodeURIComponent(tgMessage)}&parse_mode=Markdown`;
        
        // Открываем эту ссылку в новой вкладке (она отправит сообщение и сама закроется)
        window.open(telegramUrl, '_blank');
        
        // Очищаем форму
        document.getElementById('clientName').value = "";
        document.getElementById('phone_number').value = "";
        document.getElementById('commentsite').value = "";
    });
</script>
