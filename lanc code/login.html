<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCotIms8W68WFjLGsFAsLV_tfwwshusHyw",
        authDomain: "custom-site-40168.firebaseapp.com",
        databaseURL: "https://custom-site-40168-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "custom-site-40168",
        storageBucket: "custom-site-40168.appspot.com",
        messagingSenderId: "23544350313",
        appId: "1:23544350313:web:e3333d7c5164e5d0d344f8"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    const LoginForm = document.getElementById('LoginForm');
    LoginForm.addEventListener('submit', function(event) {
        event.preventDefault();
        const nameValue = document.getElementById('loginUserName').value;
        const passValue = document.getElementById('LoginPassword').value; // Исправили на большую L

        database.ref('users/' + nameValue).once('value').then((snapshot) => {
            if (snapshot.exists()) {
                const userData = snapshot.val();
                if (userData.password === passValue) {
                    sessionStorage.setItem('userLogin', nameValue);
                    sessionStorage.setItem('isLoggedIn', 'true');
                    alert("Вход успешный! Добро пожаловать в Lanc code.");
                    window.location.href = "Altegio.html"; 
                } else {
                    alert("Неверный пароль! Пожалуйста попробуете другой пароль.");
                }
            } else {
                alert("Извините вы указали неверные данные. Пожалуйста введите имя пользователя верным");
            }
        }).catch((error) => {
            alert("Ошибка: сбой базы данных. Пожалуйста повторите позднее или повторите попытку постараемся исправить как можно скорей. " + error.message);
        });
    });
</script>
