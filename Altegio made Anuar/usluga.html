<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCotIms8W68WFjLGsFAsLV_tfwwshusHyw",
        authDomain: "custom-site-40168.firebaseapp.com",
        databaseURL: "https://custom-site-40168-default-rtdb.asia-southeast1.firebasedatabase.app",
        storageBucket: "custom-site-40168.appspot.com",
        messagingSenderId: "23544350313",
        appId: "1:23544350313:web:e3333d7c5164e5d0d344f8"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const currentLogin = sessionStorage.getItem('userLogin'); 
    if (currentLogin) {
        database.ref('users/' + currentLogin).once('value').then((snapshot) => {
            if (snapshot.exists()) {
                const userData = snapshot.val();
                document.getElementById('clientName').value = userData.username;
            }
        }).catch((error) => {
            console.error("Ошибка загрузки имени из Firebase:", error);
        });
    } else {
        document.getElementById('clientName').value = "Гость (Войдите в аккаунт)";
    }
        document.getElementById('sendOrderBtn').addEventListener('click', function() {
            const nameValue = document.getElementById('clientName').value;
            const commentValue = document.getElementById('commentsite').value;
            const phoneValue = document.getElementById('phone_number').value;

            if (nameValue === "Гость (Войдите в аккаунт)") {
                alert("Ошибка! Гости не могут оставлять заказы. Пожалуйста, войдите в аккаунт.");
                window.location.href = "login.html";
                return;
            }

            if (!phoneValue.trim()) {
                alert("Пожалуйста, введите ваш номер телефона для связи!");
                return;
            }
            database.ref('orders/' + currentLogin).set({
                username: nameValue,
                phone: phoneValue,
                comment: commentValue,
                status: "Ожидает оплаты",
                date: new Date().toLocaleDateString()
            }).then(() => {
                const tgToken = "8993659223:AAGUDfeB7H4IALnElm3fSClmgqHgcMHfH5g";
                const tgChatId = "8772937687";
                const tgMessage = `*Новый заказ в Lanc Studio!*\n\n` +
                                  ` *Клиент:* ${nameValue}\n` +
                                  ` *Телефон:* ${phoneValue}\n` +
                                  ` *Комментарий:* ${commentValue}\n` +
                                  ` *Дата:* ${new Date().toLocaleDateString()}`;
                fetch(`https://telegram.org{tgToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: tgChatId,
                        text: tgMessage,
                        parse_mode: 'Markdown'
                    })
                }).then(() => {
                    alert("Ваш заказ успешно отправлен!");
                    const messageText = `Здравствуйте, Lanc Studio! Я оставил заказ на сайте. Моё имя: ${nameValue}, телефон: ${phoneValue}.`;
                    window.location.href = "https://wa.me" + encodeURIComponent(messageText); 
                }).catch((tgError) => {
                    console.error("Ошибка ТГ:", tgError);
                    window.location.href = "https://wa.me";
                });

            }).catch((error) => {
                alert("Ошибка отправки заказа в базу: " + error.message);
            });
        });

</script>
