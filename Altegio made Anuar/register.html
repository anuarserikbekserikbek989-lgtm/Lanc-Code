<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация — Lanc Studio</title>
    <style>
        body {
            background-image: url('fon_dlya_vhoda_b_regisrasii.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            margin: 0; 
        }
        button:hover { transform: scale(1.1); }
    </style>
</head>
<body>

    <h1 style="
        color: rgb(204, 204, 204);
        text-align: top;
        top: 19%;
        left: 41%;
        position: absolute;
        font-weight: bold;
        font-family: Arial, Helvetica, sans-serif;
    ">Регистрация</h1>
    <form id="RegForm">
        <button type="submit" style="
            background-color: rgb(46, 255, 4);
            color: rgb(0, 0, 0);
            padding: 10px 30px;
            border: none;
            cursor: pointer;
            position: absolute;
            top: 64%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 20px;
            border-radius: 12px;
            transition: 0.2s;
            font-weight: bold;
        ">Зарегистрироваться</button>
        <input type="text" id="RegUserName" placeholder="Введите ваше имя и фамилию" required style="
            font-size: 22px;
            top: 31%;
            right: 25%;
            left: 25%;
            position: absolute;
        ">    
        
        <input type="password" id="RegPassword" placeholder="Введите пароль" required style="
            font-size: 22px;
            top: 42%;
            right: 25%;
            left: 25%;
            position: absolute;
        ">
    </form>

    <p style="position: absolute; top: 90%; left: 43%; right: 45%; font-size: 15px;">
        Уже есть аккаунт? <a href="login.html" style="color:#0025fa; font-weight: bold;">Войти.</a>
    </p>
    <div style="background-color: rgb(46, 255, 4); width: 100%; height: 84px; position: absolute; left: 0px; top: 0px; z-index: 5;"></div>
    
    <button style="background-color: rgb(46, 255, 4); color: black; left: 12%; position: absolute; top: 10px; width: 124px; height: 64px; font-weight: bold; border-radius: 12px; border: 2px solid black; transition: 0.2s; cursor: pointer; z-index: 10;">Поддержите меня!</button>
    <button style="background-color: rgb(46, 255, 4); left: 25%; top: 10px; width: 124px; height: 64px; font-weight: bold; position: absolute; color: black; border-radius: 12px; border: 2px solid black; transition: 0.2s; cursor: pointer; z-index: 10;">Заказать услугу</button>
    <button style="background-color: rgb(46, 255, 4); left: 38%; top: 10px; width: 124px; height: 64px; font-weight: bold; position: absolute; color: black; border-radius: 12px; border: 2px solid black; transition: 0.2s; cursor: pointer; z-index: 10;">Наши контакты</button>
    
    <a href="register.html">
        <button style="right: 27%; top: 10px; border-radius: 75%; background-color: rgb(46, 255, 4); color: black; transition: 0.2s; cursor: pointer; position: absolute; font-weight: bold; width: 124px; height: 64px; border: solid black 2px; z-index: 10;">Регистрация</button>
    </a>
    <a href="login.html">
        <button style="background-color: white; border-radius: 75%; border: 2px black solid; font-weight: bold; right: 38%; position: absolute; top: 10px; height: 64px; width: 124px; transition: 0.2s; cursor: pointer; z-index: 10;">Войти</button>
    </a>
        <!-- Подключаем файлы прямо из папки твоего компьютера, без интернета! -->
    <script src="firebase-app.js"></script>
    <script src="firebase-database.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCotIms8W68WFjLGsFAsLV_tfwwshusHyw",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebasedatabase.app",
            projectId: "custom-site-40168",
            storageBucket: "://appspot.com",
            messagingSenderId: "23544350313",
            appId: "1:23544350313:web:e3333d7c5164e5d0d344f8"
        };

        // Запуск локального ядра
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const RegForm = document.getElementById('RegForm');
        RegForm.addEventListener('submit', function(event) {
            event.preventDefault(); 
            
            const regName = document.getElementById('RegUserName').value;
            const regPass = document.getElementById('RegPassword').value;

            database.ref('users/' + regName).set({
                username: regName,
                password: regPass
            }).then(() => {
                alert("Локальная регистрация успешна! Перенаправляем на вход...");
                window.location.href = "login.html"; 
            }).catch((error) => {
                alert("Ошибка: " + error.message);
            });
        });
    </script>
</body>
</html>
